[package]
name = "fpp"
version = "0.9.5"
edition = "2021"
description = "A fast Rust rewrite of Facebook's PathPicker (fpp)"
license = "MIT"

[dependencies]
regex = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
