[package]
name = "fpp2"
version = "0.1.0"
edition = "2024"
description = "Fast PathPicker — a high-performance Rust drop-in replacement for Facebook's PathPicker"
repository = "https://github.com/devinjeon/FastPathPicker"
license = "MIT"

[dependencies]
regex = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["use-dev-tty"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
vt100 = "0.16"

[[test]]
name = "e2e_screen"
path = "tests/e2e/screen_test.rs"

[[test]]
name = "e2e_pipe_stdin"
path = "tests/e2e/pipe_stdin_test.rs"

[profile.release]
lto = true
strip = true
codegen-units = 1
