[package]
name = "fpp"
version = "0.9.5"
edition = "2021"
description = "A fast Rust rewrite of Facebook's PathPicker (fpp)"
license = "MIT"

[dependencies]
regex = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["use-dev-tty"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
vt100 = "0.16"

[profile.release]
lto = true
strip = true
codegen-units = 1
